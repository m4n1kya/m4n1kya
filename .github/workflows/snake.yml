name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk@v3
        with:
          github_user_name: m4n1kya
          # Dark board colors (5 levels)
          palette: |
            ["#0A0A0A", "#1A1A1A", "#2A2A2A", "#3A3A3A", "#4A4A4A"]
          # Grey gradient snake colors
          snake_color: |
            ["#666666", "#888888", "#AAAAAA", "#CCCCCC", "#EEEEEE"]
          outputs: |
            dist/dark-grey-snake.svg
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
